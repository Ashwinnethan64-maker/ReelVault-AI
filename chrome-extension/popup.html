<!DOCTYPE html>
<html>
<head>
  <title>ReelVault Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icon.png" alt="Logo" class="logo" onerror="this.style.display='none'">
      <h1>ReelVault</h1>
    </div>
    <div class="content">
      <p id="statusMessage">Ready to save this video?</p>
      <input type="text" id="urlInput" readonly>
      <button id="saveBtn">Save to Vault</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
